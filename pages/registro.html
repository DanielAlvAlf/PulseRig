<body>
  <div class="fondo-ambiente" data-estado="sano">
    <div class="fondo-ambiente__estrellas fondo-ambiente__estrellas--lejos"></div>
    <div class="fondo-ambiente__estrellas fondo-ambiente__estrellas--cerca"></div>

  </div>
  <div class="contenido">

    <!-- ===== CABECERA ===== -->
    <header class="menu-principal">
      <div class="contenedor">
        <a href="../index.html" class="marca">
          <span class="marca__punto"></span>
          PulseRig
        </a>
        <button class="menu-toggle" type="button" data-toggle="collapse" data-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
          &#9776;
        </button>
        <nav class="menu-grupo collapse" id="menuPrincipal">
          <ul class="menu-enlaces">
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="outlet.html">Outlet</a></li>
          </ul>
          <div class="menu-acceso">
            <a href="login.html" class="btn btn-secundario">Login</a>
            <a href="registro.html" class="btn btn-primario" aria-current="page">Registro</a>
          </div>
        </nav>
      </div>
    </header>
    <!-- ===== FIN CABECERA ===== -->

    <main>
      <div class="contenedor pagina-acceso">
        <div class="pagina-acceso__caja">
          <h1>Crear cuenta</h1>
          <p class="pagina-acceso__subtitulo">Registra tu primer equipo en un par de minutos.</p>

          <form action="#">
            <!-- TODO fase 2: enviar a ... -->
            <div class="grupo-campo">
              <label class="etiqueta-campo" for="nombre">Nombre <span class="obligatorio">*</span></label>
              <input class="campo" type="text" id="nombre" name="nombre" required>
            </div>
            <div class="grupo-campo">
              <label class="etiqueta-campo" for="email">Correo electrónico <span class="obligatorio">*</span></label>
              <input class="campo" type="email" id="email" name="email" required>
            </div>
            <div class="grupo-campo">
              <label class="etiqueta-campo" for="password">Contraseña <span class="obligatorio">*</span></label>
              <input class="campo" type="password" id="password" name="password" required>
            </div>
            <div class="grupo-campo">
              <label class="etiqueta-campo" for="password2">Repite la contraseña <span class="obligatorio">*</span></label>
              <input class="campo" type="password" id="password2" name="password2" required>
            </div>

            <div class="acciones-formulario">
              <a href="../index.html" class="btn btn-secundario">Cancelar</a>
              <button type="submit" class="btn btn-primario">Crear cuenta</button>
            </div>
          </form>

          <p class="pagina-acceso__pie">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
      </div>
    </main>

    <!-- ===== PIE ===== -->
    <footer class="pie-pagina">
      <div class="contenedor">
        <p>PulseRig · Daniel Álvarez Alfonso</p>
        <a href="publico.html">Ver ficha pública de ejemplo</a>
      </div>
    </footer>
    <!-- ===== FIN PIE ===== -->

  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
